spring:
  jpa:
    show-sql: false

  datasource:
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5

# Redis connection comes from base config (spring.data.redis.*) via REDIS_HOST / REDIS_PORT.
# On AWS set REDIS_HOST to the ECS Redis service name, EC2 host, or ElastiCache endpoint.
app:
  cache:
    provider: redis          # distributed cache in production

  ingestion:
    async-thread-pool-size: 10

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}

management:
  health:
    redis:
      enabled: true          # Redis is a real dependency in prod — include it in health checks

logging:
  level:
    com.docint: INFO
    org.springframework.ai: WARN
    org.springframework.security: WARN
